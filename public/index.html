<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azarapp - Decisión en Vivo</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Press Start 2P', monospace;
  background: #0a0a14;
  color: #e0e0e0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
  image-rendering: pixelated;
}

#app {
  max-width: 780px;
  width: 100%;
  background: #16162a;
  border: 4px solid #2a2a4a;
  padding: 20px;
  position: relative;
  box-shadow: 8px 8px 0 #0a0a15, inset 0 0 0 2px #2a2a4a;
}

#scanlines {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 9999;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px
  );
}

h1 {
  text-align: center;
  color: #f5c518;
  font-size: 16px;
  text-shadow: 3px 3px 0 #8b6914;
  margin-bottom: 2px;
  letter-spacing: 2px;
}

.subtitle {
  text-align: center;
  color: #666;
  font-size: 7px;
  margin-bottom: 16px;
  letter-spacing: 3px;
}

.section-title {
  font-size: 7px;
  color: #e94560;
  margin-bottom: 6px;
  letter-spacing: 1px;
}

/* Options Input */
.input-group {
  display: flex;
  gap: 4px;
  margin-bottom: 6px;
}

#option-input {
  flex: 1;
  font-family: 'Press Start 2P', monospace;
  font-size: 7px;
  padding: 7px 8px;
  background: #0f0f1a;
  border: 3px solid #2a2a4a;
  color: #e0e0e0;
  outline: none;
  text-transform: uppercase;
}
#option-input:focus { border-color: #f5c518; }

#add-btn {
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  padding: 5px 12px;
  background: #2ecc71;
  border: 3px solid #1a7a44;
  color: #fff;
  cursor: pointer;
  transition: 0.05s linear;
}
#add-btn:active { transform: translate(2px,2px); }
#add-btn:disabled { opacity: 0.4; cursor: not-allowed; }

#options-list {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  min-height: 28px;
  margin-bottom: 12px;
  padding: 5px;
  background: #0f0f1a;
  border: 3px solid #2a2a4a;
}

.option-tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 6px;
  padding: 3px 6px;
  background: #2a2a4a;
  border: 2px solid #3a3a5a;
  color: #e0e0e0;
}
.option-tag .remove {
  cursor: pointer;
  color: #e94560;
  font-size: 8px;
  margin-left: 2px;
}

/* Mode Selector */
#mode-selector {
  display: flex;
  gap: 4px;
  margin-bottom: 12px;
}

.mode-btn {
  flex: 1;
  font-family: 'Press Start 2P', monospace;
  font-size: 7px;
  padding: 8px;
  background: #2a2a4a;
  border: 3px solid #3a3a5a;
  color: #888;
  cursor: pointer;
  transition: 0.05s linear;
  text-align: center;
}
.mode-btn.active {
  background: #e94560;
  border-color: #a13044;
  color: #fff;
  box-shadow: inset -2px -2px 0 #a13044;
}
.mode-btn:not(.active):hover { background: #3a3a5a; color: #ccc; }

/* Display Area */
#display {
  position: relative;
  min-height: 340px;
  background: #0f0f1a;
  border: 4px solid #2a2a4a;
  padding: 0;
  margin-bottom: 12px;
  overflow: hidden;
}

.mode-panel { display: none; }
.mode-panel.active { display: flex; flex-direction: column; height: 340px; }
#panel-race { height: 340px; }

/* ===== SLOT MACHINE ===== */
#panel-slot {
  background: linear-gradient(180deg, #1a1020 0%, #0f0f1a 50%, #1a1020 100%);
  position: relative;
}

.slot-top-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 8px 12px 4px;
  position: relative;
}
.slot-top-bar::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 20px;
  right: 20px;
  height: 2px;
  background: linear-gradient(90deg, transparent, #f5c518, transparent);
}
.slot-brand {
  font-size: 6px;
  color: #f5c518;
  letter-spacing: 4px;
  text-shadow: 0 0 6px rgba(245,197,24,0.3);
}

.led-strip {
  display: flex;
  gap: 4px;
  padding: 4px 12px;
  justify-content: center;
}
.led {
  width: 6px;
  height: 6px;
  border: 1px solid #3a3a5a;
  transition: 0.1s;
}
.led.on {
  box-shadow: 0 0 4px currentColor;
  border-color: currentColor;
}

.slot-main {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px 12px;
  flex: 1;
}

.reel-frame {
  display: flex;
  gap: 6px;
  padding: 10px 12px;
  background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
  border: 4px solid #8b7355;
  box-shadow: inset 0 0 0 2px #5c4a32, 0 0 12px rgba(139,115,85,0.2);
  position: relative;
}
.reel-frame::before {
  content: '';
  position: absolute;
  top: -6px; left: -6px; right: -6px; bottom: -6px;
  border: 2px solid #2a2a4a;
  pointer-events: none;
}

.reel-unit {
  width: 100px;
  position: relative;
}
.reel-window {
  height: 84px;
  overflow: hidden;
  position: relative;
  background: #08081a;
  border: 3px solid #5c4a32;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
}
.reel-window::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.02) 100%);
  pointer-events: none;
  z-index: 2;
}
.reel-window::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  height: 28px;
  margin-top: -14px;
  border-top: 2px solid rgba(245,197,24,0.2);
  border-bottom: 2px solid rgba(245,197,24,0.2);
  background: rgba(245,197,24,0.03);
  z-index: 1;
  pointer-events: none;
}

.reel-strip { transition: none; will-change: transform; }
.reel-item {
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 8px;
  color: #e0e0e0;
  padding: 0 4px;
  text-align: center;
  word-break: break-word;
  line-height: 1.1;
  font-family: 'Press Start 2P', monospace;
}
.reel-item.winner { color: #f5c518; text-shadow: 0 0 8px rgba(245,197,24,0.6); }
.reel-item.highlight { color: #2ecc71; text-shadow: 0 0 8px rgba(46,204,113,0.4); }

.lever-side {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 4px;
  position: relative;
}
.lever-rail {
  width: 4px;
  height: 120px;
  background: linear-gradient(180deg, #5c4a32, #3a2a1a, #5c4a32);
  border-radius: 2px;
  position: relative;
}
.lever-ball {
  width: 20px;
  height: 20px;
  background: radial-gradient(circle at 35% 35%, #ff6b6b, #c0392b, #8b1a1a);
  border: 2px solid #5c4a32;
  cursor: pointer;
  position: absolute;
  left: 50%;
  margin-left: -10px;
  top: 0;
  transition: top 0.15s ease-out;
  z-index: 1;
}
.lever-ball::after {
  content: '';
  position: absolute;
  top: -14px;
  left: 50%;
  margin-left: -1px;
  width: 2px;
  height: 14px;
  background: #888;
}
.lever-ball.pulled { top: 80px; transition: top 0.08s ease-in; }
.lever-ball.returning { top: 0; transition: top 0.2s cubic-bezier(0.2, 0.9, 0.3, 1.2); }

.slot-info {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 4px 12px 6px;
}
.slot-display-box {
  background: #08081a;
  border: 3px solid #2a2a4a;
  padding: 6px 14px;
  min-height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 200px;
}
.slot-display-text {
  font-size: 9px;
  color: #888;
  text-align: center;
  letter-spacing: 1px;
  transition: all 0.15s;
}
.slot-display-text.winner { color: #f5c518; text-shadow: 0 0 10px rgba(245,197,24,0.5); animation: slot-win-pulse 0.6s ease-out; }
.slot-display-text.spinning { color: #e94560; animation: slot-blink 0.15s infinite; }

@keyframes slot-win-pulse { 0% { transform: scale(1); } 40% { transform: scale(1.1); } 100% { transform: scale(1); } }
@keyframes slot-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.slot-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 4px 12px 8px;
}
.coin-slot {
  width: 24px;
  height: 28px;
  background: #2a2a4a;
  border: 3px solid #5c4a32;
  border-radius: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  position: relative;
}
.coin-slot::after { content: 'COIN'; position: absolute; bottom: -8px; font-size: 4px; color: #666; letter-spacing: 1px; }

.spin-btn {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  padding: 8px 20px;
  background: linear-gradient(180deg, #e94560, #a13044);
  border: 3px solid #5c1a2a;
  color: #fff;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 2px;
  transition: 0.05s linear;
  box-shadow: inset -2px -2px 0 #5c1a2a, 0 0 8px rgba(233,69,96,0.2);
}
.spin-btn:hover { background: linear-gradient(180deg, #ff5a75, #c0392b); }
.spin-btn:active { transform: translate(2px,2px); box-shadow: inset 2px 2px 0 #5c1a2a; }
.spin-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

.cabinet-corner { position: absolute; width: 12px; height: 12px; border-color: #8b7355; border-style: solid; }
.cabinet-corner.tl { top: 0; left: 0; border-width: 3px 0 0 3px; }
.cabinet-corner.tr { top: 0; right: 0; border-width: 3px 3px 0 0; }
.cabinet-corner.bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; }
.cabinet-corner.br { bottom: 0; right: 0; border-width: 0 3px 3px 0; }

/* ===== HORSE RACE ===== */
#race-canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }

/* Action Button */
#action-btn {
  width: 100%;
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  padding: 12px;
  background: #e94560;
  border: 4px solid #a13044;
  color: #fff;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 2px;
  transition: 0.05s linear;
  box-shadow: inset -3px -3px 0 #a13044;
}
#action-btn:hover { background: #ff5a75; }
#action-btn:active { transform: translate(2px,2px); box-shadow: inset 3px 3px 0 #a13044; }
#action-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* Confetti */
.confetti-container {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 9998;
  overflow: hidden;
}
.confetti-piece { position: absolute; width: 8px; height: 8px; top: -10px; }

/* ===== ROOM OVERLAY ===== */
#room-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(5, 5, 15, 0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10000;
  padding: 16px;
}

.room-panel {
  background: #16162a;
  border: 4px solid #2a2a4a;
  padding: 28px;
  max-width: 440px;
  width: 100%;
  position: relative;
  box-shadow: 8px 8px 0 #0a0a15, inset 0 0 0 2px #2a2a4a;
}
.room-panel::before {
  content: '';
  position: absolute;
  top: 4px; left: 4px;
  width: 10px; height: 10px;
  border-top: 3px solid #f5c518;
  border-left: 3px solid #f5c518;
}
.room-panel::after {
  content: '';
  position: absolute;
  bottom: 4px; right: 4px;
  width: 10px; height: 10px;
  border-bottom: 3px solid #f5c518;
  border-right: 3px solid #f5c518;
}

.room-title {
  font-size: 11px;
  color: #f5c518;
  text-align: center;
  margin-bottom: 6px;
  text-shadow: 2px 2px 0 #8b6914;
}
.room-sub {
  font-size: 6px;
  color: #666;
  text-align: center;
  margin-bottom: 20px;
  letter-spacing: 2px;
}

.room-btn {
  width: 100%;
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  padding: 12px;
  margin-bottom: 8px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 2px;
  transition: 0.05s linear;
}
.room-btn.primary {
  background: #e94560;
  border: 3px solid #a13044;
  color: #fff;
  box-shadow: inset -2px -2px 0 #a13044;
}
.room-btn.primary:hover { background: #ff5a75; }
.room-btn.primary:active { transform: translate(2px,2px); box-shadow: inset 2px 2px 0 #a13044; }
.room-btn.secondary {
  background: #2a2a4a;
  border: 3px solid #3a3a5a;
  color: #ccc;
}
.room-btn.secondary:hover { background: #3a3a5a; }

.room-divider {
  text-align: center;
  color: #555;
  font-size: 7px;
  margin: 12px 0;
  letter-spacing: 2px;
}
.room-divider::before, .room-divider::after {
  content: '';
  display: inline-block;
  width: 30px;
  height: 1px;
  background: #2a2a4a;
  margin: 0 8px;
  vertical-align: middle;
}

.room-input-group {
  display: flex;
  gap: 4px;
  margin-bottom: 8px;
}
.room-input {
  flex: 1;
  font-family: 'Press Start 2P', monospace;
  font-size: 7px;
  padding: 10px;
  background: #0f0f1a;
  border: 3px solid #2a2a4a;
  color: #e0e0e0;
  text-align: center;
  outline: none;
  text-transform: uppercase;
  letter-spacing: 4px;
}
.room-input:focus { border-color: #f5c518; }

.room-join-btn {
  font-family: 'Press Start 2P', monospace;
  font-size: 7px;
  padding: 10px 14px;
  background: #2ecc71;
  border: 3px solid #1a7a44;
  color: #fff;
  cursor: pointer;
}
.room-join-btn:active { transform: translate(2px,2px); }

.room-status {
  text-align: center;
  font-size: 6px;
  color: #e94560;
  margin-top: 8px;
  min-height: 14px;
}

/* ===== ROOM INFO BAR ===== */
#room-bar {
  display: none;
  align-items: center;
  justify-content: space-between;
  padding: 6px 10px;
  background: #0f0f1a;
  border: 3px solid #2a2a4a;
  margin-bottom: 12px;
  font-size: 6px;
}
#room-bar.visible { display: flex; }

.room-code-display {
  color: #f5c518;
  letter-spacing: 3px;
}
.room-users {
  color: #888;
}
.room-qr-btn {
  font-family: 'Press Start 2P', monospace;
  font-size: 6px;
  padding: 4px 8px;
  background: #2a2a4a;
  border: 2px solid #3a3a5a;
  color: #aaa;
  cursor: pointer;
}
.room-qr-btn:hover { background: #3a3a5a; }
.room-qr-btn:active { transform: translate(1px,1px); }

/* QR modal */
#qr-modal {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(5,5,15,0.92);
  z-index: 10001;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
#qr-modal.visible { display: flex; }

.qr-box {
  background: #16162a;
  border: 4px solid #2a2a4a;
  padding: 24px;
  text-align: center;
  position: relative;
  box-shadow: 8px 8px 0 #0a0a15;
}
.qr-box img {
  image-rendering: pixelated;
  width: 200px;
  height: 200px;
  margin-bottom: 12px;
}
.qr-label {
  font-size: 7px;
  color: #888;
  margin-bottom: 4px;
}
.qr-code-text {
  font-size: 9px;
  color: #f5c518;
  letter-spacing: 3px;
  margin-bottom: 12px;
}
.qr-close {
  font-family: 'Press Start 2P', monospace;
  font-size: 7px;
  padding: 8px 20px;
  background: #2a2a4a;
  border: 3px solid #3a3a5a;
  color: #ccc;
  cursor: pointer;
}
.qr-close:hover { background: #3a3a5a; }

/* Loading spinner */
.spinner {
  display: inline-block;
  width: 12px;
  height: 12px;
  border: 2px solid #e94560;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.5s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Responsive */
@media (max-width: 640px) {
  h1 { font-size: 11px; }
  .reel-unit { width: 70px; }
  .reel-window { height: 72px; }
  .reel-item { height: 24px; font-size: 6px; }
  .reel-window::before { height: 24px; margin-top: -12px; }
  #app { padding: 12px; }
  .reel-frame { padding: 6px 8px; gap: 4px; }
  .lever-rail { height: 80px; }
  .lever-ball { width: 16px; height: 16px; margin-left: -8px; }
  .lever-ball.pulled { top: 50px; }
  .lever-ball::after { top: -10px; height: 10px; }
  #option-input { font-size: 6px; }
  .slot-brand { font-size: 5px; }
  .room-panel { padding: 18px; }
  .qr-box img { width: 160px; height: 160px; }
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: #0f0f1a; }
::-webkit-scrollbar-thumb { background: #3a3a5a; }
</style>
</head>
<body>

<div id="scanlines"></div>
<div class="confetti-container" id="confetti-container"></div>

<!-- ===== ROOM OVERLAY ===== -->
<div id="room-overlay">
  <div class="room-panel">
    <div class="room-title">✦ SALA PIXEL ✦</div>
    <div class="room-sub">CREA O ÚNETE A UNA SALA</div>

    <button class="room-btn primary" id="btn-create">🎮 CREAR SALA</button>

    <div class="room-divider">O</div>

    <div class="room-input-group">
      <input class="room-input" id="room-code-input" placeholder="CÓDIGO" maxlength="6">
      <button class="room-join-btn" id="btn-join">→</button>
    </div>

    <div class="room-status" id="room-status">&nbsp;</div>
  </div>
</div>

<!-- ===== QR MODAL ===== -->
<div id="qr-modal">
  <div class="qr-box">
    <img id="qr-image" src="" alt="QR">
    <div class="qr-label">COMPARTE ESTE CÓDIGO</div>
    <div class="qr-code-text" id="qr-code-text">------</div>
    <button class="qr-close" id="qr-close">CERRAR</button>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div id="app">

  <!-- Room info bar -->
  <div id="room-bar">
    <span class="room-code-display">SALA: <span id="room-code-label">------</span></span>
    <span class="room-users" id="room-users">👤 1</span>
    <button class="room-qr-btn" id="show-qr">📱 QR</button>
  </div>

  <h1>✦ DECISIÓN PIXEL ✦</h1>
  <p class="subtitle">ELIGE TU DESTINO</p>

  <div class="section-title">> OPCIONES</div>
  <div class="input-group">
    <input type="text" id="option-input" placeholder="AÑADIR..." maxlength="20">
    <button id="add-btn">+</button>
  </div>
  <div id="options-list"></div>

  <div class="section-title">> MODO</div>
  <div id="mode-selector">
    <button class="mode-btn active" data-mode="slot">🎰 TRAGAPERRAS</button>
    <button class="mode-btn" data-mode="race">🏇 CARRERA</button>
  </div>

  <div id="display">
    <!-- SLOT MACHINE PANEL -->
    <div class="mode-panel active" id="panel-slot">
      <div class="cabinet-corner tl"></div>
      <div class="cabinet-corner tr"></div>
      <div class="cabinet-corner bl"></div>
      <div class="cabinet-corner br"></div>

      <div class="slot-top-bar">
        <span class="led" style="color:#e94560"></span>
        <span class="slot-brand">★ T R A G A P E R R A S ★</span>
        <span class="led" style="color:#3498db"></span>
      </div>

      <div class="led-strip" id="led-strip"></div>

      <div class="slot-main">
        <div class="reel-frame">
          <div class="reel-unit"><div class="reel-window"><div class="reel-strip" id="strip-0"></div></div></div>
          <div class="reel-unit"><div class="reel-window"><div class="reel-strip" id="strip-1"></div></div></div>
          <div class="reel-unit"><div class="reel-window"><div class="reel-strip" id="strip-2"></div></div></div>
        </div>

        <div class="lever-side">
          <div class="lever-rail">
            <div class="lever-ball" id="lever-ball"></div>
          </div>
        </div>
      </div>

      <div class="slot-info">
        <div class="slot-display-box">
          <div class="slot-display-text" id="slot-result">¡TIRA DE LA PALANCA!</div>
        </div>
      </div>

      <div class="slot-controls">
        <div class="coin-slot"></div>
        <button class="spin-btn" id="slot-spin">🎰 SPIN</button>
      </div>

      <div class="led-strip" style="padding: 2px 12px 6px" id="led-strip-bottom"></div>
    </div>

    <!-- HORSE RACE PANEL -->
    <div class="mode-panel" id="panel-race">
      <canvas id="race-canvas"></canvas>
    </div>
  </div>

  <button id="action-btn">🎰 ¡GIRAR!</button>
</div>

<script>
// ===== SOCKET.IO CONNECTION =====
const socket = io();

let roomCode = null;
let isHost = false;
let localBusy = false;
let cooldownInterval = null;

const COOLDOWN_SECONDS = 10;

function startCooldownTimer(seconds) {
  if (cooldownInterval) clearInterval(cooldownInterval);
  let remaining = seconds;
  actionBtn.textContent = `⏳ ESPERA ${remaining}s`;
  actionBtn.disabled = true;
  cooldownInterval = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(cooldownInterval);
      cooldownInterval = null;
      return;
    }
    actionBtn.textContent = `⏳ ESPERA ${remaining}s`;
  }, 1000);
}

const state = {
  options: [],
  mode: 'slot',
};

// ===== DOM REFS =====
const $ = id => document.getElementById(id);

const roomOverlay = $('room-overlay');
const btnCreate = $('btn-create');
const btnJoin = $('btn-join');
const roomCodeInput = $('room-code-input');
const roomStatus = $('room-status');
const roomBar = $('room-bar');
const roomCodeLabel = $('room-code-label');
const roomUsers = $('room-users');
const showQrBtn = $('show-qr');
const qrModal = $('qr-modal');
const qrImage = $('qr-image');
const qrCodeText = $('qr-code-text');
const qrClose = $('qr-close');

const input = $('option-input');
const addBtn = $('add-btn');
const list = $('options-list');
const modeBtns = document.querySelectorAll('.mode-btn');
const panels = { slot: $('panel-slot'), race: $('panel-race') };
const actionBtn = $('action-btn');
const canvas = $('race-canvas');
const ctx = canvas.getContext('2d');
const confettiContainer = $('confetti-container');

const strips = [$('strip-0'), $('strip-1'), $('strip-2')];
const slotResult = $('slot-result');
const slotSpin = $('slot-spin');
const leverBall = $('lever-ball');
const ledStrip = $('led-strip');
const ledStripBottom = $('led-strip-bottom');

const HORSE_COLORS = ['#e94560','#2ecc71','#3498db','#f5c518','#9b59b6','#1abc9c','#e67e22','#ecf0f1'];

// ===== ROOM MANAGEMENT =====

btnCreate.addEventListener('click', () => {
  roomStatus.innerHTML = '<span class="spinner"></span>CREANDO...';
  socket.emit('create-room', null, (res) => {
    if (res.success) {
      roomCode = res.code;
      isHost = true;
      state.options = res.state.options;
      state.mode = res.state.mode;
      enterRoom();
    }
  });
});

btnJoin.addEventListener('click', () => {
  const code = roomCodeInput.value.trim().toUpperCase();
  if (!code || code.length < 4) {
    roomStatus.textContent = 'CÓDIGO INVÁLIDO';
    return;
  }
  roomStatus.innerHTML = '<span class="spinner"></span>UNIENDO...';
  socket.emit('join-room', code, (res) => {
    if (res.error) {
      roomStatus.textContent = res.error;
      return;
    }
    roomCode = code;
    isHost = false;
    state.options = res.state.options;
    state.mode = res.state.mode;
    enterRoom();
  });
});

roomCodeInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') btnJoin.click();
});

function enterRoom() {
  roomOverlay.style.display = 'none';
  roomBar.classList.add('visible');
  roomCodeLabel.textContent = roomCode;
  updateRoomUsers(1);
  renderOptions();
  updateDisplay();
}

function updateRoomUsers(count) {
  roomUsers.textContent = `👤 ${count}`;
}

// ===== SOCKET EVENTS =====

socket.on('state-update', (data) => {
  if (data.options) {
    state.options = data.options;
    renderOptions();
    if (state.mode === 'slot') buildReelStrips();
    updateDisplay();
  }
});

socket.on('room-info', (data) => {
  if (data.userCount !== undefined) updateRoomUsers(data.userCount);
  if (data.host !== undefined) isHost = (socket.id === data.host);
});

socket.on('new-host', (data) => {
  isHost = (socket.id === data.hostId);
});

socket.on('decision-start', (data) => {
  state.mode = data.mode;
  localBusy = true;
  actionBtn.disabled = true;

  panels.slot.classList.toggle('active', state.mode === 'slot');
  panels.race.classList.toggle('active', state.mode === 'race');
  modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));

  if (state.mode === 'slot') startSlotSync(data.winner);
  else startRaceSync(data.winner);
});

socket.on('decision-result', (data) => {
  startCooldownTimer(10);
});

socket.on('cooldown-end', () => {
  localBusy = false;
  actionBtn.disabled = false;
  actionBtn.textContent = state.mode === 'slot' ? '🎰 ¡GIRAR!' : '🏇 ¡CORRE!';
});

socket.on('busy-timeout', () => {
  startCooldownTimer(10);
});

// ===== OPTIONS MANAGEMENT =====

function renderOptions() {
  list.innerHTML = '';
  if (state.options.length === 0) {
    list.innerHTML = '<span style="color:#555;font-size:6px;padding:3px;">SIN OPCIONES</span>';
    return;
  }
  state.options.forEach((opt, i) => {
    const tag = document.createElement('span');
    tag.className = 'option-tag';
    tag.innerHTML = `${opt} <span class="remove" data-index="${i}">×</span>`;
    tag.querySelector('.remove').addEventListener('click', () => {
      socket.emit('remove-option', i);
    });
    list.appendChild(tag);
  });
}

addBtn.addEventListener('click', () => {
  const val = input.value.trim().toUpperCase();
  if (!val) return;
  socket.emit('add-option', val);
  input.value = '';
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') addBtn.click();
});

// ===== MODE SWITCHING =====

modeBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    if (localBusy) return;
    modeBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.mode = btn.dataset.mode;
    panels.slot.classList.toggle('active', state.mode === 'slot');
    panels.race.classList.toggle('active', state.mode === 'race');
    actionBtn.textContent = state.mode === 'slot' ? '🎰 ¡GIRAR!' : '🏇 ¡CORRE!';
    updateDisplay();
  });
});

// ===== UPDATE DISPLAY =====

function updateDisplay() {
  if (state.mode === 'slot') {
    buildReelStrips();
    showSlotIdle();
  } else {
    resizeCanvas();
    drawRaceIdle();
  }
}

// ===== SLOT MACHINE =====

const LED_COLORS = ['#e94560','#2ecc71','#3498db','#f5c518','#9b59b6'];

function buildLEDs() {
  [ledStrip, ledStripBottom].forEach(container => {
    container.innerHTML = '';
    for (let i = 0; i < 12; i++) {
      const led = document.createElement('span');
      led.className = 'led';
      led.style.color = LED_COLORS[i % LED_COLORS.length];
      led.style.background = '#1a1a2e';
      container.appendChild(led);
    }
  });
}
buildLEDs();

function flashLEDs(on) {
  const allLEDs = [...ledStrip.querySelectorAll('.led'), ...ledStripBottom.querySelectorAll('.led')];
  allLEDs.forEach((led) => {
    led.classList.toggle('on', on);
    if (on) {
      led.style.background = led.style.color;
      led.style.boxShadow = `0 0 6px ${led.style.color}`;
    } else {
      led.style.background = '#1a1a2e';
      led.style.boxShadow = 'none';
    }
  });
}

function buildReelStrips() {
  const opts = state.options;
  if (opts.length === 0) {
    strips.forEach(s => { s.innerHTML = ''; });
    return;
  }
  strips.forEach(strip => {
    strip.innerHTML = '';
    const repeats = 10;
    for (let r = 0; r < repeats; r++) {
      opts.forEach(opt => {
        const div = document.createElement('div');
        div.className = 'reel-item';
        div.textContent = opt;
        strip.appendChild(div);
      });
    }
  });
}

function showSlotIdle() {
  const opts = state.options;
  if (opts.length === 0) {
    strips.forEach(s => {
      s.innerHTML = '<div class="reel-item" style="color:#555">---</div>';
      s.style.transform = 'translateY(0)';
    });
    slotResult.textContent = 'AÑADE OPCIONES';
    slotResult.className = 'slot-display-text';
    return;
  }
  strips.forEach((strip) => {
    if (strip.children.length > 0) {
      const items = strip.querySelectorAll('.reel-item');
      items.forEach(item => item.classList.remove('winner', 'highlight'));
      strip.style.transform = 'translateY(0px)';
    }
  });
  slotResult.textContent = '¡TIRA DE LA PALANCA!';
  slotResult.className = 'slot-display-text';
}

// ===== SLOT SYNC =====

function startSlotSync(serverWinner) {
  flashLEDs(true);
  buildReelStrips();
  const opts = state.options;
  if (opts.length < 2) return;

  const itemH = 28;
  const finalWinner = serverWinner;
  const winnerIdx = opts.indexOf(finalWinner);
  const reelDurations = [2800, 3100, 3400];
  const startTime = performance.now();
  let completed = 0;

  leverBall.classList.remove('returning');
  leverBall.classList.add('pulled');
  setTimeout(() => {
    leverBall.classList.remove('pulled');
    leverBall.classList.add('returning');
    setTimeout(() => leverBall.classList.remove('returning'), 250);
  }, 150);

  slotResult.textContent = '🎰 GIRANDO...';
  slotResult.className = 'slot-display-text spinning';

  function getTargetY() {
    const cycle = Math.floor(Math.random() * 3) + 4;
    const centerStripIdx = cycle * opts.length + winnerIdx;
    return -(centerStripIdx - 1) * itemH;
  }

  strips.forEach((strip, i) => {
    const duration = reelDurations[i];
    const startY = 0;
    const targetY = getTargetY();

    function animate() {
      const elapsed = performance.now() - startTime;
      const localElapsed = Math.max(0, elapsed - (i * 100));
      if (localElapsed >= duration) {
        strip.style.transform = `translateY(${targetY}px)`;
        strip.style.transition = 'none';
        completed++;
        const allItems = strip.querySelectorAll('.reel-item');
        allItems.forEach(item => item.classList.remove('winner', 'highlight'));
        const centerIdx = Math.abs(Math.floor(targetY / itemH)) + 1;
        if (allItems[centerIdx]) allItems[centerIdx].classList.add('winner');

        if (completed === 3) {
          setTimeout(() => {
            slotResult.textContent = `★ ¡${finalWinner}! ★`;
            slotResult.className = 'slot-display-text winner';
            strips.forEach(s => {
              const items = s.querySelectorAll('.reel-item');
              items.forEach(item => item.classList.remove('winner', 'highlight'));
              items.forEach(item => {
                if (item.textContent === finalWinner) item.classList.add('winner');
              });
            });
            flashLEDs(false);
            spawnConfetti();
            socket.emit('decision-done', { winner: finalWinner });
          }, 400);
        }
        return;
      }

      const progress = localElapsed / duration;
      const eased = 1 - Math.pow(1 - progress, 2.5);
      const currentY = startY + (targetY - startY) * eased;
      strip.style.transform = `translateY(${currentY}px)`;
      strip.style.transition = 'none';
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  });
}

leverBall.addEventListener('click', () => {
  if (!localBusy && isHost) {
    socket.emit('trigger-decision', { mode: 'slot' });
  }
});

slotSpin.addEventListener('click', () => {
  if (!localBusy && isHost) {
    socket.emit('trigger-decision', { mode: 'slot' });
  }
});

// ===== HORSE RACE =====

let raceAnimId = null;

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas._dpr = dpr;
  canvas._w = Math.floor(rect.width - 4);
  canvas._h = Math.floor(rect.height - 4);
  if (canvas._w <= 0) canvas._w = 600;
  if (canvas._h <= 0) canvas._h = 320;
  canvas.width = canvas._w * dpr;
  canvas.height = canvas._h * dpr;
  canvas.style.width = canvas._w + 'px';
  canvas.style.height = canvas._h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}

function drawRaceIdle() {
  const opts = state.options;
  const cw = canvas._w || 600, ch = canvas._h || 320;
  if (opts.length === 0) {
    ctx.fillStyle = '#0f0f1a';
    ctx.fillRect(0, 0, cw, ch);
    ctx.fillStyle = '#555';
    ctx.font = '8px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('AÑADE OPCIONES', cw / 2, ch / 2);
    return;
  }
  drawRaceState(opts.map((name, i) => ({
    name, x: 0, color: HORSE_COLORS[i % HORSE_COLORS.length],
    finished: false, place: null
  })), opts, 0);
}

function drawRaceState(horses, options, elapsed) {
  const w = canvas._w || 600, h = canvas._h || 320;
  const numHorses = options.length;
  const laneH = Math.max(28, Math.floor((h - 16) / numHorses));
  const startX = 50;
  const finishX = w - 40;
  const trackLen = finishX - startX;

  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, w, h);

  for (let i = 0; i < numHorses; i++) {
    const y = 8 + i * laneH;
    ctx.fillStyle = i % 2 === 0 ? '#15152a' : '#121222';
    ctx.fillRect(startX - 8, y, trackLen + 16, laneH);
  }

  const checkerSize = 6;
  for (let row = 0; row < Math.ceil(h / checkerSize); row++) {
    for (let col = 0; col < 2; col++) {
      const cx = finishX + col * checkerSize;
      const cy = row * checkerSize;
      ctx.fillStyle = (row + col) % 2 === 0 ? '#fff' : '#000';
      ctx.fillRect(cx, cy, checkerSize, checkerSize);
    }
  }

  ctx.fillStyle = '#f5c518';
  ctx.font = '6px "Press Start 2P", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('META', finishX, 7);
  ctx.fillStyle = '#fff';
  ctx.fillRect(startX - 2, 0, 2, h);

  for (let i = 0; i < horses.length; i++) {
    const horse = horses[i];
    const y = 8 + i * laneH + 4;
    const x = startX + horse.x * trackLen;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(x + 2, y + laneH - 4, 28, 4);
    drawPixelHorse(ctx, x, y, 28, laneH - 8, horse.color, horse.legPhase || 0);
    ctx.fillStyle = '#ccc';
    ctx.font = '6px "Press Start 2P", monospace';
    ctx.textAlign = 'left';
    ctx.fillText(horse.name, Math.max(x + 32, startX + 32), y + 4);
    if (horse.place !== null) {
      ctx.fillStyle = '#f5c518';
      ctx.font = '9px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`#${horse.place}`, x + 14, y - 4);
    }
  }

  ctx.strokeStyle = '#2a2a4a';
  ctx.lineWidth = 2;
  ctx.strokeRect(startX - 8, 4, trackLen + 16, numHorses * laneH);
}

function drawPixelHorse(ctx, x, y, maxW, maxH, color) {
  const s = Math.min(maxW / 16, maxH / 10);
  const px = Math.max(1, Math.floor(s));
  const legPhase = arguments[6] || 0;
  const frame = Math.floor(legPhase) % 6;
  const bodyBob = (frame < 3) ? -1 : 0;
  const headNod = (frame === 1 || frame === 2) ? 1 : (frame === 4 || frame === 5) ? -1 : 0;
  const tailSwish = (frame % 2 === 0) ? 0 : 1;

  ctx.fillStyle = color;
  ctx.fillRect(x + px * 3, y + px * 2 + bodyBob, px * 7, px * 4);
  ctx.fillRect(x + px * 4, y + px * 1 + bodyBob, px * 5, px * 1);
  ctx.fillRect(x + px * 8, y + px * 1 + bodyBob + headNod, px * 3, px * 2);
  ctx.fillRect(x + px * 9, y + px * 0 + bodyBob + headNod, px * 2, px * 1);
  ctx.fillRect(x + px * 10, y + px * 0 + bodyBob + headNod, px * 4, px * 2);
  ctx.fillRect(x + px * 11, y - px * 1 + bodyBob + headNod, px * 2, px * 1);
  ctx.fillRect(x + px * tailSwish, y + px * 2 + bodyBob, px * 3, px * 2);
  ctx.fillRect(x + px * tailSwish, y + px * 1 + bodyBob, px * 2, px * 1);

  const darker = darkenColor(color, 0.6);
  ctx.fillStyle = darker;
  ctx.fillRect(x + px * 8, y + px * 1 + bodyBob + headNod, px * 2, px * 1);
  ctx.fillRect(x + px * 3, y + px * 4 + bodyBob, px * 7, px * 2);

  const legPoses = [
    { back: 0, front: 0 },
    { back: -1, front: 1 },
    { back: 0, front: 0 },
    { back: 1, front: -1 },
    { back: 0, front: 0 },
    { back: -1, front: 1 },
  ];
  const lp = legPoses[frame];
  ctx.fillRect(x + px * (4 + lp.back), y + px * 6, px * 2, px * 3);
  ctx.fillRect(x + px * (7 + lp.front), y + px * 6, px * 2, px * 3);

  ctx.fillRect(x + px * 9, y + px * 0 + bodyBob + headNod, px * 1, px * 2);
  ctx.fillRect(x + px * 8, y + px * 1 + bodyBob + headNod, px * 1, px * 1);
  ctx.fillStyle = '#000';
  ctx.fillRect(x + px * 13, y + px * 0 + bodyBob + headNod, px * 1, px * 1);
  ctx.fillRect(x + px * tailSwish, y + px * 1 + bodyBob, px * 1, px * 1);
}

function darkenColor(hex, factor) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.floor(r*factor)},${Math.floor(g*factor)},${Math.floor(b*factor)})`;
}

// ===== RACE SYNC =====

function startRaceSync(serverWinner) {
  const opts = state.options;
  if (opts.length < 2) return;
  resizeCanvas();

  const raceDuration = 10000;
  const startTime = performance.now();

  const horses = opts.map((name, i) => ({
    name, x: 0, color: HORSE_COLORS[i % HORSE_COLORS.length],
    finished: false, place: null,
    baseSpeed: 0.18 + Math.random() * 0.28,
    burstProb: 0.06 + Math.random() * 0.12,
    burstPower: 0.04 + Math.random() * 0.06,
    stamina: 0.7 + Math.random() * 0.6,
    legPhase: 0,
  }));

  let finishedCount = 0;

  function animate() {
    const elapsed = performance.now() - startTime;
    const progress = Math.min(elapsed / raceDuration, 1);

    for (const horse of horses) {
      if (horse.finished) continue;
      let speed = horse.baseSpeed * (0.004 + progress * 0.006);
      if (Math.random() < horse.burstProb) speed += horse.burstPower * 0.08;
      speed *= (0.7 + Math.random() * 0.6);
      speed *= (0.4 + horse.stamina * 0.6);
      if (horse.x > 0.7) speed *= 0.7 + (1 - horse.x) * 0.5;
      const active = horses.filter(h => !h.finished);
      const leader = Math.max(...active.map(h => h.x));
      const avg = active.reduce((s, h) => s + h.x, 0) / active.length;
      if (leader > 0.4 && horse.x < avg) speed *= 1.1;
      if (leader - horse.x < 0.25 && horse.x < leader) speed *= 1.08;
      horse.x += speed;
      horse.x = Math.min(horse.x, 1.05);
      horse.legPhase = (horse.legPhase || 0) + speed * 3;
    }

    const finishers = horses.filter(h => !h.finished && h.x >= 1.0);
    finishers.sort((a, b) => {
      if (Math.abs(b.x - a.x) > 0.001) return b.x - a.x;
      return Math.random() - 0.5;
    });
    for (const horse of finishers) {
      horse.finished = true;
      finishedCount++;
      horse.place = finishedCount;
    }

    drawRaceState(horses, opts, elapsed);

    const allFinished = horses.every(h => h.finished);
    const timeUp = elapsed >= raceDuration;

    if (allFinished || timeUp) {
      drawRaceState(horses, opts, elapsed);
      ctx.fillStyle = '#f5c518';
      ctx.font = '11px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      const winnerText = `★ ¡${serverWinner}! ★`;
      const tw = ctx.measureText ? ctx.measureText(winnerText).width : 200;
      const tx = (canvas._w || 600) / 2;
      const ty = (canvas._h || 320) - 14;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(tx - tw/2 - 10, ty - 16, tw + 20, 28);
      ctx.strokeStyle = '#f5c518';
      ctx.lineWidth = 2;
      ctx.strokeRect(tx - tw/2 - 10, ty - 16, tw + 20, 28);
      ctx.fillStyle = '#f5c518';
      ctx.fillText(winnerText, tx, ty + 2);
      spawnConfetti();
      socket.emit('decision-done', { winner: serverWinner });
      return;
    }

    raceAnimId = requestAnimationFrame(animate);
  }

  animate();
}

// ===== CONFETTI =====

function spawnConfetti() {
  const colors = ['#e94560','#2ecc71','#3498db','#f5c518','#9b59b6','#1abc9c','#e67e22'];
  confettiContainer.innerHTML = '';
  for (let i = 0; i < 50; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.width = (4 + Math.random() * 6) + 'px';
    piece.style.height = (4 + Math.random() * 6) + 'px';
    piece.style.animation = `confetti-fall ${2 + Math.random() * 2}s ease-out forwards`;
    piece.style.animationDelay = Math.random() * 0.5 + 's';
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    confettiContainer.appendChild(piece);
  }
  setTimeout(() => { confettiContainer.innerHTML = ''; }, 4000);
}

const styleSheet = document.createElement('style');
styleSheet.textContent = `
@keyframes confetti-fall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}
`;
document.head.appendChild(styleSheet);

// ===== ACTION BUTTON =====

actionBtn.addEventListener('click', () => {
  if (localBusy || !isHost) return;
  socket.emit('trigger-decision', { mode: state.mode });
});

// ===== WINDOW RESIZE =====

window.addEventListener('resize', () => {
  if (state.mode === 'race') {
    resizeCanvas();
    drawRaceIdle();
  }
});

// ===== QR CODE =====

showQrBtn.addEventListener('click', () => {
  if (!roomCode) return;
  const url = `${window.location.origin}?join=${roomCode}`;
  qrCodeText.textContent = roomCode;
  qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
  qrModal.classList.add('visible');
});

qrClose.addEventListener('click', () => {
  qrModal.classList.remove('visible');
});

qrModal.addEventListener('click', (e) => {
  if (e.target === qrModal) qrModal.classList.remove('visible');
});

// Check URL for join code
const urlParams = new URLSearchParams(window.location.search);
const joinCode = urlParams.get('join');
if (joinCode) {
  roomCodeInput.value = joinCode.toUpperCase();
  btnJoin.click();
}
</script>
</body>
</html>
